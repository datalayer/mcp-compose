name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0 releases mcp-compose 1.0.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: Build the Python package (UI included)
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check the tag matches the package version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('mcp_compose/__version__.py').read_text()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mcp_compose/__version__.py ($PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify package
        run: |
          ls -la dist/
          python -m twine check --strict dist/*
          # The wheel must ship the built UI, not the placeholder.
          python -m zipfile -l dist/*.whl | grep -q "mcp_compose/ui/dist/index.html"
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import mcp_compose; print(mcp_compose.__version__)"
          /tmp/verify/bin/mcp-compose --help > /dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  # Job 2: Publish to PyPI with OIDC trusted publishing (no API token)
  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-compose
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Job 3: Build and push the Docker image
  build-docker:
    name: Build and Push Docker Image
    needs: build-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            datalayer/mcp-compose:latest
            datalayer/mcp-compose:${{ needs.build-python.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Create the GitHub release
  create-release:
    name: Create GitHub Release
    needs: [build-python, publish-pypi, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: dist

      - name: Create release with generated notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-python.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $VERSION" \
            --generate-notes \
            --notes "- [PyPI](https://pypi.org/project/mcp-compose/$VERSION/)
          - [Docker Hub](https://hub.docker.com/r/datalayer/mcp-compose/tags?name=$VERSION)"
